<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ingreso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contenedor-principal {
            display: flex;
            height: 100vh;
        }

        .imagen-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ACCF8B;
            position: relative;
        }

        .formulario-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .formulario-box {
            width: 100%;
            max-width: 350px;
        }

        .btn-personalizado {
            background-color: #ACCF8B;
            border-color: #5C7545;
            color: rgb(0, 0, 0);
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }

        .btn-personalizado:hover {
            background-color: #ACCF8B;
            border-color: #ACCF8B;
        }

        .titulo-seccion {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .img-con-margen {
            width: 305px;
            height: 295px;
            object-fit: contain;
            border-radius: 25%;
            border: 5px solid #567836;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 5px;
            background-color: white;
        }

        .selector-color {
            position: absolute;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .texto-ayuda {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }

        .invalid-feedback {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        /* adminError de error para admin */
        .admin-error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="contenedor-principal">
        <div class="imagen-container">
            <img src="../Imagenes/fc-removebg-preview.png" class="img-con-margen" alt="Escudo">
        </div>

        <div class="formulario-container">
            <div class="formulario-box">
                <div class="titulo-seccion">Ingreso</div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usuario" class="form-label"></label>
                        <input type="text" class="form-control" id="usuario" required>
                        <div class="texto-ayuda">Ingresar minimo 10 caracteres</div>
                        <div class="invalid-feedback" id="usuarioError"></div>
                    </div>
                    <div class="mb-3">
                        <label for="contrasena" class="form-label"></label>
                        <input type="password" class="form-control" id="contrasena" required >
                        <div class="texto-ayuda">Ingresar minimo 5 caracteres</div>
                        <div class="invalid-feedback" id="contrasenaError"></div>
                    </div>
                    <button type="submit" class="btn btn-personalizado">Ingresar</button>
                    <div class="admin-error" id="adminError"></div>
                </form>
            </div>
        </div>
    </div>
    <p id="mesaje"></p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;
            const adminError = document.getElementById('adminError');
            let isValid = true;

            // Validación de usuario
            // if (usuario.length < 10) {
            //     document.getElementById('usuario').classList.add('is-invalid');
            //     document.getElementById('usuarioError').textContent = 'El usuario debe tener al menos 10 caracteres';
            //     isValid = false;
            // } else {
            //     document.getElementById('usuario').classList.remove('is-invalid');
            //     document.getElementById('usuarioError').textContent = '';
            // }
  
            // Validación de contraseña
            // if (contrasena.length < 5) {
            //     document.getElementById('contrasena').classList.add('is-invalid');
            //     document.getElementById('contrasenaError').textContent = 'La contraseña debe tener al menos 5 caracteres';
            //     isValid = false;
            // } else {
            //     document.getElementById('contrasena').classList.remove('is-invalid');
            //     document.getElementById('contrasenaError').textContent = '';
            // }

            // Si es válido, verificar si es admin
            if (isValid) {
      try {
        const res = await fetch("http://localhost:3000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, contrasena })
        });

        const data = await res.json();
        console.log(data);
        adminError.innerText = data.message;

        if (data.success) {
          adminError.style.color = "green";

          const role = data.user.role; // <- esta es la propiedad correcta
          sessionStorage.setItem("tipoUsuario", role);

          if (role === "administrador") {
            window.location.href = "Administracion.html";
          } else if (role === "estudiante") {
            window.location.href = "Estudiantes.html";
          } else if (role === "docente") {
            window.location.href = "DocenteIngreso.html";
          } else {
            adminError.innerText = "Rol desconocido.";
            adminError.style.color = "red";
          }

        } else {
          adminError.style.color = "red";
        }
      } catch (error) {
        adminError.innerText = "Error de conexión con el servidor.";
        adminError.style.color = "red";
      }
    }
  });
</script>
</body>

</html>
