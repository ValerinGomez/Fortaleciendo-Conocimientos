<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración CEFA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ACCF8B;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #2e7d32;
            color: white;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            position: relative;
        }
        
        .guides-section {
            width: 50%;
            padding: 20px;
            background-color: #a4c585; /* Verde claro por defecto */
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        
        .guide-item {
            padding: 15px;
            margin: 15px 0;
            background-color: rgba(255,255,255,0.7); /* Fondo semi-transparente */
            border-left: 4px solid #2e7d32;
            font-size: 18px;
            border-radius: 5px;
        }
        
        .color-picker {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .color-picker label {
            font-weight: bold;
            color: #333;
        }
        
        
        
        .image-section {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .image-container {
            width: 79.9%;
            height: 71.0%;
            background-color: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #2e7d32;
            color: white;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .save-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .exit-btn {
            background-color: #f44336;
            color: white;
        }
        
        .nav-btn {
            background-color: #2196F3;
            color: white;
        }
        
        .admin-title {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="admin-title">ESTUDIANTE</div>
      <button class="exit-btn" id="exit-btn">SALIR</button>

    </div>
    
    <div class="main-content">
        <div class="guides-section" id="guidesContainer">
           
            
            <div class="guide-item">GUIA #1: BALANCEO DE ECUACIONES QUÍMICAS POR METODO DEL TANTEO</div>
            <div class="guide-item">GUIA #2: CANTIDAD DE SUSTANCIA</div>
            <div class="guide-item">GUIA #3: RELACIONES MOLARES</div>
            <div class="guide-item">GUIA #4: REACTIVO LIMITE</div>
            <div class="guide-item">GUIA #5: PORCENTAJE DE PUREZA Y PORCENTAJE DE RENDIMIENTO</div>
        </div>
        
        <div class="image-section">
            <div class="image-container">
                <img class="preview-image" src="../Imagenes/carbonero.png" alt="Imagen de contenido">
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div></div>
        
    </div>

    <script>
        // Selector de color para el fondo de guías
        const colorPicker = document.getElementById('guideColor');
        const guidesContainer = document.getElementById('guidesContainer');
        
        colorPicker.addEventListener('input', function() {
            guidesContainer.style.backgroundColor = this.value;
        });
        
        
                  document.querySelector(".exit-btn").addEventListener("click", function() {
                        window.location.href = "Index.html";
});

    </script>
</body>
</html>
