<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ingreso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contenedor-principal { 
            display: flex; 
            height: 100vh;
        }

        .imagen-container { 
            flex: 1; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            background-color: #ACCF8B; 
            position: relative;
        }

        .formulario-container { 
            flex: 1; 
            display: flex;
            justify-content: center; 
            align-items: center;
            padding: 20px;
        }

        .formulario-box { 
            width: 100%;
            max-width: 350px; 
        }

        .btn-personalizado { 
            background-color: #ACCF8B; 
            border-color: #5C7545; 
            color: rgb(0, 0, 0); 
            width: 100%;
            padding: 10px;
            font-weight: bold;
        }
        
        .btn-personalizado:hover { 
            background-color: #ACCF8B; 
            border-color: #ACCF8B; 
        }
        
        .titulo-seccion {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
       
        .img-con-margen {
            width: 305px;
            height: 295px;
            object-fit: contain;
            border-radius: 25%;
            border: 5px solid #567836; /* Margen verde inicial */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 5px; /* Espacio entre el margen y la imagen */
            background-color: white;
        }

        .selector-color {
            position: absolute;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
       
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <div class="imagen-container">
            <img src="../Imagenes/fc-removebg-preview.png" class="img-con-margen" alt="Escudo">
            
            
        </div>
        
        <div class="formulario-container">
            <div class="formulario-box">
                <div class="titulo-seccion">Ingreso</div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" required>
                    </div>
                    <button type="submit" class="btn btn-personalizado">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;
            
            if (usuario && contrasena) {
                window.location.href = "index.html";
            }
        });

        // Cambiar color del margen
        const colorPicker = document.getElementById('colorPicker');
        const imagen = document.querySelector('.img-con-margen');
        
        colorPicker.addEventListener('input', function() {
            imagen.style.borderColor = this.value;
        });
    </script>
</body>
</html>
